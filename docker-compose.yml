services:
  app:
    build: 
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: commerce-flow
    working_dir: /var/www/html
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: mysql_database
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: commerce_flow
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: commerceflow
      MYSQL_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
  

volumes:
    mysql_data:
  