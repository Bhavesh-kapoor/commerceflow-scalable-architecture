services:
  app:
    build: 
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: commerce-flow
    working_dir: /var/www/html
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: mysql_database
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: commerce_flow
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: commerceflow
      MYSQL_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  nginx:
    build: 
      context: ./backend
      dockerfile: ../docker/nginx/Dockerfile
    container_name: commerce_flow-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  
  redis:
    image: redis:8.6-alpine
    container_name: commerceflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  notification-service:
    build: 
      context: ./node-services/notification-service
      dockerfile: Dockerfile
    
    container_name: notification-service

    ports:
      - "3000:3000"
    
    volumes:
      - ./node-services/notification-service:/app
    
    depends_on:
      - redis
  
  notification-worker-service:
    build: 
     context: ./node-services/notification-service
     dockerfile: Dockerfile
    
    container_name: notification-worker
    command: npm run worker
    depends_on:
      - redis

  mailhog:
    image: axllent/mailpit:latest
    container_name: mailhog-service
    ports:
      - "8025:8025"
      - "1025:1025"

    
volumes:
    mysql_data:
    redis_data:
  